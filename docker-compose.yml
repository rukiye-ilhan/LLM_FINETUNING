version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  backend:
    build: .
    container_name: emparag_backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./outputs:/app/outputs
      - ./backend:/app/backend
      - ./src:/app/src
      - ./scripts:/app/scripts
    environment:
      - APP_ENV=local
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-counsel_rag}
      - HF_LOCAL_FILES_ONLY=${HF_LOCAL_FILES_ONLY:-true}
      - TOP_K=${TOP_K:-4}
      - MAX_NEW_TOKENS=${MAX_NEW_TOKENS:-120}
      - RAG_RETRIEVAL_POLICY=${RAG_RETRIEVAL_POLICY:-first_turn_only}
      - RAG_ALLOW_EXPLICIT_TOPIC_SHIFT=${RAG_ALLOW_EXPLICIT_TOPIC_SHIFT:-true}
      - CHAT_HISTORY_MESSAGE_LIMIT=${CHAT_HISTORY_MESSAGE_LIMIT:-24}
      - PROMPT_HISTORY_MESSAGE_LIMIT=${PROMPT_HISTORY_MESSAGE_LIMIT:-10}
      - HF_TOKEN=${HF_TOKEN}
    depends_on:
      - qdrant
    command: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    container_name: emparag_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev

volumes:
  qdrant_storage:
