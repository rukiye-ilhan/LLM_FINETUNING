version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  backend:
    build: .
    container_name: emparag_backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./outputs:/app/outputs
      - ./backend:/app/backend
      - ./src:/app/src
      - ./scripts:/app/scripts
    environment:
      - APP_ENV=local
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - HF_TOKEN=${HF_TOKEN}
    depends_on:
      - qdrant
    command: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    container_name: emparag_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev

volumes:
  qdrant_storage: